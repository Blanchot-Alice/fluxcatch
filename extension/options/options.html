<!doctype html>
<html lang="zh-CN" data-surface="settings">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FluxCatch</title>
  <link rel="stylesheet" href="../ui/v2/tokens.css">
  <link rel="stylesheet" href="../ui/v2/system.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="pond" data-pond aria-hidden="true"></div>
  <a class="skip-link btn btn-secondary" href="#content" data-msg="settings.skip"></a>

  <header class="topbar" id="topbar" data-scrolled="false">
    <!-- BrandMark M is inserted here; Settings needs no other top-bar control. -->
    <div class="topbar-inner column lead-grid" id="topbarInner"></div>
  </header>

  <main class="column page" id="page">
    <header class="page-head">
      <h1 class="t-display" id="settingsTitle" data-msg="settings.title"></h1>
      <p class="t-body" id="settingsSubtitle" data-msg="settings.subtitle"></p>
    </header>

    <div class="nav-layout">
      <div class="nav-slot" id="navSlot"></div>
      <div class="content" id="content" tabindex="-1">
        <div class="load-state" id="loadState" role="status" aria-live="polite">
          <p class="t-body" id="loadText"></p>
          <button class="btn btn-tertiary" id="loadRetry" type="button" data-msg="action.retry" hidden></button>
        </div>
        <div class="sections" id="sections" aria-busy="true" inert></div>
      </div>
    </div>
  </main>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="menu-layer" id="menuLayer" hidden><div class="menu"></div></div>

  <script type="module" src="options.js"></script>
</body>
</html>
