<!doctype html>
<html lang="zh-CN" data-surface="sidepanel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Havre</title>
  <link rel="stylesheet" href="../ui/v2/tokens.css">
  <link rel="stylesheet" href="../ui/v2/system.css">
  <link rel="stylesheet" href="../ui/v2/media.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="pond" data-pond aria-hidden="true"></div>

  <header class="topbar" id="topbar" data-scrolled="false">
    <div class="topbar-inner column lead-grid" id="topbarInner">
      <!-- BrandMark S is inserted first; the two icon buttons share the one trailing cell. -->
      <span class="bar-actions">
        <button id="urlButton" class="icon-button" type="button" data-msg-label="media.downloadLink"></button>
        <button id="settingsButton" class="icon-button" type="button" data-msg-label="action.settings"></button>
      </span>
    </div>
  </header>

  <main class="column page" id="page">
    <!-- The engine's one status line is app-wide: above the lists, as in the popup. -->
    <p class="status-line lead-grid" id="engineLine" role="status" hidden></p>

    <section id="mediaSection" aria-labelledby="mediaHeading">
      <div id="mediaHeaderSlot"></div>
      <p class="status-line lead-grid" id="mediaState" role="status" hidden></p>
      <ul class="rows media-rows" id="mediaRows" hidden></ul>
      <div id="mediaEmptySlot"></div>
    </section>

    <section id="downloadsSection" aria-labelledby="downloadsHeading">
      <div id="downloadsHeaderSlot"></div>
      <p class="status-line lead-grid" id="jobsState" role="status" hidden></p>
      <div id="focusSlot"></div>
      <ul class="rows job-rows" id="jobRows"></ul>
      <div id="jobsEmptySlot"></div>
    </section>
  </main>

  <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="menu-layer" id="menuLayer" hidden><div class="menu"></div></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
