<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FluxCatch</title>
  <link rel="stylesheet" href="../ui/v2/tokens.css">
  <link rel="stylesheet" href="../ui/v2/system.css">
  <link rel="stylesheet" href="../ui/v2/media.css">
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <div class="pond" data-pond aria-hidden="true"></div>

  <header class="topbar" id="topbar" data-scrolled="false">
    <!-- BrandMark M is inserted here. -->
    <div class="topbar-inner column lead-grid" id="topbarInner"></div>
  </header>

  <main class="column page" id="page">
    <header class="page-head text-column">
      <h1 class="t-display" id="previewTitle" data-msg="preview.title"></h1>
      <!-- The view switch (segmented control) is inserted here; ?view=<id> opens a view directly. -->
      <div class="view-switch" id="viewSwitch"></div>
    </header>

    <section class="view" id="view-type" data-view-panel="type" role="tabpanel" hidden></section>
    <section class="view" id="view-text" data-view-panel="text" role="tabpanel" hidden></section>
    <section class="view" id="view-controls" data-view-panel="controls" role="tabpanel" hidden></section>
    <section class="view" id="view-rows" data-view-panel="rows" role="tabpanel" hidden></section>
    <section class="view" id="view-feedback" data-view-panel="feedback" role="tabpanel" hidden></section>
    <section class="view" id="view-overlays" data-view-panel="overlays" role="tabpanel" hidden></section>
  </main>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="menu-layer" id="menuLayer" hidden><div class="menu"></div></div>

  <script type="module" src="preview.js"></script>
</body>
</html>
