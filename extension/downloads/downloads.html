<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Havre</title>
  <link rel="stylesheet" href="../ui/v2/tokens.css">
  <link rel="stylesheet" href="../ui/v2/system.css">
  <link rel="stylesheet" href="downloads.css">
</head>
<body>
  <div class="pond" data-pond aria-hidden="true"></div>

  <header class="topbar" id="topbar" data-scrolled="false">
    <div class="topbar-inner column lead-grid" id="topbarInner">
      <!-- BrandMark is inserted here; the settings button is the only other item. -->
      <button id="settingsButton" class="icon-button" type="button" data-msg-label="action.settings"></button>
    </div>
  </header>

  <main class="column page" id="page">
    <header class="page-head text-column">
      <h1 class="t-display" id="pageTitle" data-msg="downloads.title"></h1>
      <p class="t-meta" id="pageSummary"></p>
    </header>

    <form class="url-row" id="urlForm" novalidate>
      <label class="field url-field" for="urlInput">
        <span class="field-glyph url-glyph" id="urlGlyph"></span>
        <span class="sr-only" data-msg="downloads.urlLabel"></span>
        <input id="urlInput" type="url" autocomplete="off" spellcheck="false" maxlength="4096" data-msg-placeholder="downloads.urlPlaceholder">
      </label>
      <button id="urlSubmit" class="btn btn-primary" type="submit" data-msg="action.download"></button>
    </form>

    <p class="status-line lead-grid" id="statusLine" role="status" hidden></p>

    <section class="active-section" id="activeSection" aria-labelledby="activeHeading" hidden>
      <h2 class="group-label t-label text-column" id="activeHeading" data-msg="group.active"></h2>
      <div id="focusSlot"></div>
      <ul class="rows" id="activeRows"></ul>
    </section>

    <div class="filter-row" id="filterRow">
      <div class="segmented" id="filters" role="tablist" data-msg-label="downloads.filterLabel">
        <button type="button" role="tab" data-filter="all" aria-selected="true"><span data-msg="downloads.filter.all"></span><span class="count" id="countAll"></span></button>
        <button type="button" role="tab" data-filter="completed" aria-selected="false" tabindex="-1"><span data-msg="downloads.filter.completed"></span><span class="count" id="countCompleted"></span></button>
        <button type="button" role="tab" data-filter="failed" aria-selected="false" tabindex="-1"><span data-msg="downloads.filter.failed"></span><span class="count" id="countFailed"></span></button>
      </div>
      <label class="field search-field" for="searchInput">
        <span class="field-glyph search-glyph" id="searchGlyph"></span>
        <span class="sr-only" data-msg="downloads.searchLabel"></span>
        <input id="searchInput" type="search" autocomplete="off" data-msg-placeholder="downloads.searchPlaceholder">
      </label>
      <button id="pageMoreButton" class="icon-button" type="button" aria-haspopup="menu" data-msg-label="downloads.moreLabel"></button>
    </div>

    <p class="status-line lead-grid" id="loadState" role="status"></p>

    <section class="history" id="history" aria-live="polite" hidden></section>

    <section class="empty-state text-column" id="emptyState" hidden>
      <p class="t-empty" id="emptySentence"></p>
      <p class="t-body" id="emptyBody"></p>
      <button class="btn btn-tertiary" id="emptyAction" type="button" hidden></button>
    </section>
  </main>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="menu-layer" id="menuLayer" hidden><div class="menu"></div></div>

  <script type="module" src="downloads.js"></script>
</body>
</html>
