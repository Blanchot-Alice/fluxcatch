<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FluxCatch</title>
  <link rel="stylesheet" href="../ui/v2/tokens.css">
  <link rel="stylesheet" href="../ui/v2/system.css">
  <link rel="stylesheet" href="designer.css">
</head>
<body>
  <!-- The UI editor: a developer tool reached from Settings -> Lab -> Developer. Plain on purpose. -->
  <header class="topbar" id="topbar" data-scrolled="false">
    <div class="topbar-inner column lead-grid" id="topbarInner">
      <span class="bar-actions"><a class="btn btn-tertiary" id="backLink" href="../options/options.html" data-msg="settings.designer.back"></a></span>
    </div>
  </header>

  <main class="column designer-page" id="page">
    <header class="designer-head">
      <h1 class="t-title" data-msg="settings.editor.name"></h1>
      <p class="t-body" data-msg="settings.designer.intro"></p>
      <p class="t-meta" id="devState" role="status"></p>
    </header>

    <div class="designer-layout">
      <form id="designerForm" class="designer-form" novalidate>
        <section class="designer-group" aria-labelledby="layoutHeading">
          <h2 class="t-title" id="layoutHeading" data-msg="settings.designer.layoutHeading"></h2>
          <div class="designer-fields" id="layoutFields"></div>
          <div class="designer-accent">
            <label class="t-row" for="accentColorInput" data-msg="settings.designer.accent"></label>
            <span class="accent-row">
              <input id="accentColorInput" name="accentColor" type="color">
              <button class="btn btn-tertiary" id="accentThemeButton" type="button" data-msg="settings.designer.accentTheme"></button>
            </span>
          </div>
        </section>

        <div class="designer-actions">
          <button class="btn btn-primary" type="submit" data-msg="settings.designer.save"></button>
          <button class="btn btn-tertiary" id="resetButton" type="button" data-msg="settings.designer.reset"></button>
        </div>
        <p class="t-body" id="designerStatus" role="status" aria-live="polite"></p>

        <details class="designer-file">
          <summary class="t-row" data-msg="settings.designer.fileHeading"></summary>
          <div class="designer-fields" id="fileFields"></div>
          <div class="designer-actions">
            <label class="btn btn-tertiary file-button" for="jsonFileInput"><span data-msg="settings.designer.chooseFile"></span></label>
            <input id="jsonFileInput" class="sr-only" type="file" accept="application/json,.json">
            <button class="btn btn-tertiary" id="importButton" type="button" data-msg="settings.designer.import"></button>
            <button class="btn btn-tertiary" id="exportButton" type="button" data-msg="settings.designer.export"></button>
          </div>
          <p class="t-meta setting-error" id="jsonError" role="alert" hidden></p>
        </details>
      </form>

      <aside class="designer-preview" id="previewCanvas" aria-labelledby="previewHeading">
        <p class="t-row" id="previewHeading" data-msg="settings.designer.previewHeading"></p>
        <h3 class="t-display" data-msg="settings.title"></h3>
        <p class="t-body" data-msg="settings.subtitle"></p>
        <div class="preview-sections">
          <div class="preview-section">
            <h4 class="t-title" data-msg="settings.section.status"></h4>
            <p class="t-body" data-msg="settings.engine.name"></p>
          </div>
          <div class="preview-section">
            <h4 class="t-title" data-msg="settings.section.localEngine"></h4>
            <!-- A sample of the accent; Save and apply stays the view's one primary button. -->
            <button class="btn btn-secondary" type="button" disabled data-msg="action.setUp"></button>
          </div>
          <div class="preview-section">
            <h4 class="t-title" data-msg="settings.section.saving"></h4>
            <p class="t-body" data-msg="settings.location.name"></p>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script type="module" src="designer.js"></script>
</body>
</html>
