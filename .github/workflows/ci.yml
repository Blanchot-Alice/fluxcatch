name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python3 -m unittest discover -s native-host/tests -v
      - run: python3 scripts/validate.py
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: fluxcatch-dist
          path: dist/
